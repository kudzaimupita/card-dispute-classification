# Real-text evaluation slice: BANKING77 test intents mapped onto this project's labels.
# BANKING77 (PolyAI, CC BY 4.0) has no intents for goods_not_received or
# subscription_cancellation, so those labels are absent from this slice. Intents whose
# mapping is ambiguous (for example extra_charge_on_statement) are excluded.

dataset: PolyAI/banking77
split: test
mapping:
  fraud:
    - card_payment_not_recognised
    - cash_withdrawal_not_recognised
    - compromised_card
    - direct_debit_payment_not_recognised
  duplicate_charge:
    - transaction_charged_twice
    - wrong_amount_of_cash_received
  other:
    - declined_card_payment
    - card_payment_fee_charged
    - card_payment_wrong_exchange_rate
    - Refund_not_showing_up
output: data/external/banking77.jsonl
